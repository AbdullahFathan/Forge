openapi: 3.0.3
info:
  title: WorkSpace API
  version: "1.1.0"
  description: Phase 4 Audit, Notifications, Reports, Dashboards
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: users
  - name: departments
  - name: projects
  - name: tasks
  - name: resources
  - name: audit
  - name: notifications
  - name: reports
  - name: dashboards
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnvelopeError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        roleId: { type: string, format: uuid }
        roleCode: { type: string }
        departmentId: { type: string, format: uuid, nullable: true }
        departmentName: { type: string }
        capacityHoursPerDay: { type: integer }
        isActive: { type: boolean }
        skills:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Department:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness
      responses:
        "200":
          description: OK
  /auth/login:
    post:
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Access token and user; refresh cookie set
        "401":
          description: Invalid credentials
        "403":
          description: Inactive user
        "429":
          description: Rate limited
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token
      responses:
        "200":
          description: New access token
        "401":
          description: Invalid refresh
  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate refresh family and clear cookie
      responses:
        "200":
          description: Logged out
  /users/me:
    get:
      tags: [users]
      security: [{ BearerAuth: [] }]
      summary: Current user profile
      responses:
        "200":
          description: Profile
        "401":
          description: Unauthorized
    patch:
      tags: [users]
      security: [{ BearerAuth: [] }]
      summary: Update own name or password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                password: { type: string }
                currentPassword: { type: string }
      responses:
        "200":
          description: Updated profile
  /users:
    get:
      tags: [users]
      security: [{ BearerAuth: [] }]
      summary: List users (user.manage)
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
        - in: query
          name: departmentId
          schema: { type: string, format: uuid }
        - in: query
          name: roleId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Paged users
        "403":
          description: Forbidden
    post:
      tags: [users]
      security: [{ BearerAuth: [] }]
      summary: Create user (user.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, roleId]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                roleId: { type: string, format: uuid }
                departmentId: { type: string, format: uuid }
                capacityHoursPerDay: { type: integer }
                isActive: { type: boolean }
      responses:
        "201":
          description: Created
  /users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [users]
      security: [{ BearerAuth: [] }]
      summary: Get user (user.manage)
      responses:
        "200":
          description: User
    patch:
      tags: [users]
      security: [{ BearerAuth: [] }]
      summary: Update user (user.manage)
      responses:
        "200":
          description: Updated
    delete:
      tags: [users]
      security: [{ BearerAuth: [] }]
      summary: Soft-delete user (user.manage)
      responses:
        "200":
          description: Deleted
  /departments:
    get:
      tags: [departments]
      security: [{ BearerAuth: [] }]
      summary: List departments (department.manage)
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
      responses:
        "200":
          description: Paged departments
        "403":
          description: Forbidden
    post:
      tags: [departments]
      security: [{ BearerAuth: [] }]
      summary: Create department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created
  /departments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [departments]
      security: [{ BearerAuth: [] }]
      summary: Get department
      responses:
        "200":
          description: Department
    patch:
      tags: [departments]
      security: [{ BearerAuth: [] }]
      summary: Update department
      responses:
        "200":
          description: Updated
    delete:
      tags: [departments]
      security: [{ BearerAuth: [] }]
      summary: Soft-delete department
      responses:
        "200":
          description: Deleted
  /projects:
    get:
      tags: [projects]
      security: [{ BearerAuth: [] }]
      summary: List projects visible to the caller
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: departmentId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Paged projects with completionPercent
        "401":
          description: Unauthorized
    post:
      tags: [projects]
      security: [{ BearerAuth: [] }]
      summary: Create project (project.create); owner is added as LEAD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startDate, targetEndDate, ownerId]
              properties:
                name: { type: string }
                description: { type: string }
                status: { type: string, enum: [DRAFT, ACTIVE, ON_HOLD, COMPLETED, ARCHIVED] }
                priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
                startDate: { type: string, format: date }
                targetEndDate: { type: string, format: date }
                ownerId: { type: string, format: uuid }
                departmentId: { type: string, format: uuid }
                tags:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Created
        "400":
          description: Validation
        "403":
          description: Forbidden
  /projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [projects]
      security: [{ BearerAuth: [] }]
      summary: Project summary (progress, task counts, members, recent activity)
      responses:
        "200":
          description: Summary
        "403":
          description: Forbidden
    patch:
      tags: [projects]
      security: [{ BearerAuth: [] }]
      summary: Update project (owner, Lead, Admin, Super Admin)
      responses:
        "200":
          description: Updated
        "400":
          description: Illegal lifecycle or dates
    delete:
      tags: [projects]
      security: [{ BearerAuth: [] }]
      summary: Archive project (project.delete) — status ARCHIVED + soft delete
      responses:
        "200":
          description: Archived
  /projects/{id}/members:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [projects]
      security: [{ BearerAuth: [] }]
      summary: List project members
      responses:
        "200":
          description: Members
    post:
      tags: [projects]
      security: [{ BearerAuth: [] }]
      summary: Add member (LEAD, MEMBER, VIEWER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                role: { type: string, enum: [LEAD, MEMBER, VIEWER] }
      responses:
        "201":
          description: Created
        "409":
          description: Duplicate member
  /projects/{id}/members/{userId}:
    delete:
      tags: [projects]
      security: [{ BearerAuth: [] }]
      summary: Remove member (cannot remove owner without transfer)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Removed
  /projects/{id}/tasks:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tasks]
      security: [{ BearerAuth: [] }]
      summary: List tasks (filters status, assignee, priority, dueFrom, dueTo, label, include=subtasks)
      responses:
        "200":
          description: Paged tasks
    post:
      tags: [tasks]
      security: [{ BearerAuth: [] }]
      summary: Create task (task.manage + project manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                parentTaskId: { type: string, format: uuid }
                status: { type: string }
                priority: { type: string }
                estimatedHours: { type: number }
                startDate: { type: string, format: date }
                dueDate: { type: string, format: date }
                labels:
                  type: array
                  items: { type: string }
                position: { type: integer }
                assigneeIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Created
  /tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tasks]
      security: [{ BearerAuth: [] }]
      summary: Task detail with dependsOn, dependents, warnings
      parameters:
        - in: query
          name: include
          schema: { type: string, enum: [subtasks] }
      responses:
        "200":
          description: Task
    patch:
      tags: [tasks]
      security: [{ BearerAuth: [] }]
      summary: Update task; assignees may change status and position only
      responses:
        "200":
          description: Updated
        "400":
          description: Status, depth, or Finish-to-Start guard
    delete:
      tags: [tasks]
      security: [{ BearerAuth: [] }]
      summary: Soft-delete task
      responses:
        "200":
          description: Deleted
  /tasks/{id}/dependencies:
    post:
      tags: [tasks]
      security: [{ BearerAuth: [] }]
      summary: Add Finish-to-Start dependency (same project, no cycles)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dependsOnTaskId]
              properties:
                dependsOnTaskId: { type: string, format: uuid }
      responses:
        "201":
          description: Created
  /tasks/{id}/dependencies/{depId}:
    delete:
      tags: [tasks]
      security: [{ BearerAuth: [] }]
      summary: Remove dependency
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: depId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Removed
  /tasks/{id}/comments:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tasks]
      security: [{ BearerAuth: [] }]
      summary: List comments (no edit/delete in MVP)
      responses:
        "200":
          description: Comments
    post:
      tags: [tasks]
      security: [{ BearerAuth: [] }]
      summary: Add progress comment (assignee or project manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: Created
  /me/workload:
    get:
      tags: [resources]
      security: [{ BearerAuth: [] }]
      summary: My workload (self, or ?userId= with user.manage or capacity.view)
      parameters:
        - in: query
          name: userId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Active allocations, assigned tasks, next 4 weeks load
  /resources/allocations:
    get:
      tags: [resources]
      security: [{ BearerAuth: [] }]
      summary: List allocations (PM scoped to managed projects)
      parameters:
        - in: query
          name: userId
          schema: { type: string, format: uuid }
        - in: query
          name: projectId
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
      responses:
        "200":
          description: Page of allocations
    post:
      tags: [resources]
      security: [{ BearerAuth: [] }]
      summary: Create allocation (overlap same user+project rejected; over 100% saved with warnings)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, projectId, allocationPercent, startDate, endDate]
              properties:
                userId: { type: string, format: uuid }
                projectId: { type: string, format: uuid }
                allocationPercent: { type: number }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                role: { type: string, enum: [LEAD, MEMBER, VIEWER] }
      responses:
        "201":
          description: Created with warnings[] and overAllocated
  /resources/allocations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [resources]
      security: [{ BearerAuth: [] }]
      summary: Update allocation
      responses:
        "200":
          description: Updated
    delete:
      tags: [resources]
      security: [{ BearerAuth: [] }]
      summary: Soft-delete allocation (does not remove project member)
      responses:
        "200":
          description: Deleted
  /resources/capacity:
    get:
      tags: [resources]
      security: [{ BearerAuth: [] }]
      summary: Capacity forecast (capacity.view; 4-12 weeks)
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
        - in: query
          name: granularity
          schema: { type: string, enum: [week, month] }
        - in: query
          name: departmentId
          schema: { type: string, format: uuid }
        - in: query
          name: skill
          schema: { type: string }
      responses:
        "200":
          description: Per-user buckets with utilizationPercent and band
        "403":
          description: Forbidden (e.g. Project Manager)
  /resources/matrix:
    get:
      tags: [resources]
      security: [{ BearerAuth: [] }]
      summary: Allocation matrix (departmentId required if more than 200 users)
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
        - in: query
          name: granularity
          schema: { type: string, enum: [week, month] }
        - in: query
          name: departmentId
          schema: { type: string, format: uuid }
        - in: query
          name: skill
          schema: { type: string }
      responses:
        "200":
          description: users, periods, cells
  /resources/availability:
    get:
      tags: [resources]
      security: [{ BearerAuth: [] }]
      summary: Users with utilization under 80% in the period
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
        - in: query
          name: departmentId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sorted by remaining capacity desc
  /resources/overload-alerts:
    get:
      tags: [resources]
      security: [{ BearerAuth: [] }]
      summary: Users over 100% on any day in the next 14 days
      responses:
        "200":
          description: Overload alerts
  /resources/holidays:
    get:
      tags: [resources]
      security: [{ BearerAuth: [] }]
      summary: List holidays (Admin / department.manage)
      responses:
        "200":
          description: Holidays
    post:
      tags: [resources]
      security: [{ BearerAuth: [] }]
      summary: Create holiday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, name]
              properties:
                date: { type: string, format: date }
                name: { type: string }
      responses:
        "201":
          description: Created
  /resources/holidays/{id}:
    delete:
      tags: [resources]
      security: [{ BearerAuth: [] }]
      summary: Delete holiday
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
  /projects/{id}/activity:
    get:
      tags: [projects]
      security: [{ BearerAuth: [] }]
      summary: Project-scoped audit activity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
      responses:
        "200":
          description: Paged audit rows
  /audit-logs:
    get:
      tags: [audit]
      security: [{ BearerAuth: [] }]
      summary: List immutable audit logs (audit.read); format=csv streams CSV
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
        - in: query
          name: userId
          schema: { type: string, format: uuid }
        - in: query
          name: entityType
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string }
        - in: query
          name: to
          schema: { type: string }
        - in: query
          name: format
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: Page or CSV
        "403":
          description: Forbidden
  /notifications:
    get:
      tags: [notifications]
      security: [{ BearerAuth: [] }]
      summary: List own notifications
      parameters:
        - in: query
          name: unread
          schema: { type: boolean }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
      responses:
        "200":
          description: Page
  /notifications/unread-count:
    get:
      tags: [notifications]
      security: [{ BearerAuth: [] }]
      summary: Unread count
      responses:
        "200":
          description: unreadCount
  /notifications/{id}/read:
    patch:
      tags: [notifications]
      security: [{ BearerAuth: [] }]
      summary: Mark one read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
  /notifications/read-all:
    post:
      tags: [notifications]
      security: [{ BearerAuth: [] }]
      summary: Mark all read
      responses:
        "200":
          description: OK
  /reports/project-status:
    get:
      tags: [reports]
      security: [{ BearerAuth: [] }]
      summary: Project status report (report.export)
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json, csv, pdf] }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: departmentId
          schema: { type: string, format: uuid }
        - in: query
          name: projectId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: JSON, CSV, or PDF
        "403":
          description: Forbidden
  /reports/resource-utilization:
    get:
      tags: [reports]
      security: [{ BearerAuth: [] }]
      summary: Resource utilization report
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json, csv, pdf] }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: departmentId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rows matching capacity engine
  /reports/task-completion:
    get:
      tags: [reports]
      security: [{ BearerAuth: [] }]
      summary: Task completion report
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json, csv, pdf] }
        - in: query
          name: groupBy
          schema: { type: string, enum: [project, user] }
        - in: query
          name: projectId
          schema: { type: string, format: uuid }
        - in: query
          name: departmentId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Done vs total
  /dashboards/executive:
    get:
      tags: [dashboards]
      security: [{ BearerAuth: [] }]
      summary: Executive dashboard (Admin, Super Admin)
      responses:
        "200":
          description: Portfolio aggregates
        "403":
          description: Forbidden
  /dashboards/project-manager:
    get:
      tags: [dashboards]
      security: [{ BearerAuth: [] }]
      summary: Project manager dashboard
      responses:
        "200":
          description: Owned projects, attention tasks, team capacity
  /dashboards/member:
    get:
      tags: [dashboards]
      security: [{ BearerAuth: [] }]
      summary: Member dashboard
      responses:
        "200":
          description: Assigned tasks, weekly load, latest notifications
